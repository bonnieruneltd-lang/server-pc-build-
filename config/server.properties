# server.properties — tuned for Forge 1.20.1 + Villager Recruits/Workers, 30 players
# Place in the server root (next to the forge-*-shim.jar), next to world/.
# These are the values discussed in README.md section 8.

# --- the important ones ---
max-players=30
view-distance=6
simulation-distance=4
entity-broadcast-range-percentage=80
network-compression-threshold=256
sync-chunk-writes=false
max-tick-time=60000

# --- world / gameplay ---
level-name=world
level-seed=
level-type=minecraft\:normal
gamemode=survival
force-gamemode=false
difficulty=normal
hardcore=false
allow-flight=true
allow-nether=true
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
generate-structures=true
max-world-size=29999984

# --- protection / admin ---
spawn-protection=0
enable-command-block=false
enable-query=false

# RCON is how backup-world.sh and systemd ask the server to save/flush/stop.
# Keep it firewalled! ufw in the setup script only opens 25565/tcp.
# Change this password, then store the same value in /opt/minecraft/rcon.password
# (chmod 600, owned by the minecraft user) for the scripts to read.
enable-rcon=true
rcon.password=CHANGE_ME_BEFORE_FIRST_START
rcon.port=25575
broadcast-rcon-to-ops=false

online-mode=true
white-list=false
enforce-whitelist=false
op-permission-level=4
function-permission-level=2

# --- misc ---
motd=\u00A76Villager Kingdom \u00A78| \u00A7f1.20.1 Forge
player-idle-timeout=0
pvp=true
prevent-proxy-connections=false
max-build-height=320
enable-status=true
hide-online-players=false
broadcast-console-to-ops=true
log-ips=true
resource-pack=
require-resource-pack=false
pause-when-empty-seconds=0
